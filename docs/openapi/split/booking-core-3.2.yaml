components:
  schemas:
    LegacyErrorResponse:
      type: object
      deprecated: true
      description: 'Legacy runtime error payload from ErrorMiddlewareCustom. Deprecated
        in favor of ApiError. Planned sunset date: 2026-06-30.'
      required:
      - error
      - reason
      properties:
        error:
          type: boolean
        reason:
          type: string
      examples:
      - error: true
        reason: Нет bearer токена
      x-replaced-by: "#/components/schemas/ApiError"
      x-migration-note: 'Migrate to ApiError: map reason -> message, keep code from
        HTTP status, move extra data to details.'
    ApiError:
      type: object
      required:
      - code
      - message
      description: Unified error contract for client SDKs.
      properties:
        code:
          type: string
          description: Application or HTTP status code as string (e.g. "400", "VALIDATION_ERROR").
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          additionalProperties: true
          description: Additional payload for validation fields or debug metadata.
      examples:
      - code: '400'
        message: Bad request
        details:
          field: email
      - code: '401'
        message: Нет bearer токена
    ErrorResponse:
      oneOf:
      - "$ref": "#/components/schemas/LegacyErrorResponse"
      - "$ref": "#/components/schemas/ApiError"
      description: Transition error envelope. During migration clients should support
        both legacy and new formats.
      x-migration-note: LegacyErrorResponse is deprecated. Prefer ApiError for new
        clients and SDK generation.
    PostPublicBookingSalonBysalonIdByResponse:
      type: object
      additionalProperties: false
      description: 'Auto-generated placeholder response schema for POST /v1/public/booking/salon/{salonId}.
        Replace with explicit DTO schema from route `.openAPI(response: .type(...))`.'
      properties: {}
    GetPublicBookingAppointmentByappointmentIdByResponse:
