          description: Application or HTTP status code as string (e.g. "400", "VALIDATION_ERROR").
        message:
          type: string
          description: Human-readable error message.
        details:
          type: object
          additionalProperties: true
          description: Additional payload for validation fields or debug metadata.
      examples:
